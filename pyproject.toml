[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repolens-engineering"
version = "0.1.1"
description = "Evidence-based repository engineering-quality analysis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.scripts]
repolens = "repolens.cli:main"

[project.urls]
Repository = "https://github.com/asadabbas717/RepoLens"
Issues = "https://github.com/asadabbas717/RepoLens/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML>=6.0.12,<7",
    "bandit>=1.8",
    "pip-audit>=2.8",
    "build>=1.2",
    "setuptools>=77",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repolens = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", ".github/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["repolens"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
