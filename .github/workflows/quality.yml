name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install lock tooling
        run: python -m pip install uv==0.12.23
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest --cov --cov-report=term-missing
      - run: uv run --locked bandit -r src -ll
      - run: uv run --locked pip-audit
      - run: uv run --locked python -m build --no-isolation
